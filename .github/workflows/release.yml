# A feat or fix commit on main creates the next PATCH only (vX.Y.Z+1).
# Minor/major never advance unless Sagiv explicitly asks (see docs/version-renumber-1.0.x.md
# and scripts/patch-only-analyzer.cjs). The executable is built in this workflow.
# A tag created with the default GITHUB_TOKEN does not start a second workflow.
name: Release
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic
        with:
          semantic_version: 25
          branches: |
            ['main']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: >-
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.release.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve the release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}".Trim()
          if (-not $version) {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag must be vMAJOR.MINOR.PATCH." }
            $version = $Matches[1]
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release version must be MAJOR.MINOR.PATCH." }
          "version=$version" >> $env:GITHUB_OUTPUT
      # IncludeAllContentForSelfExtract ships fixtures/catalog.json (and the other
      # Content JSON) inside the single-file exe. Without it, the release asset is
      # only the exe and PriceCatalog cannot resolve NPC / Discord quotes on hover.
      - name: Publish the single-file executable
        run: dotnet publish companion/MarketNotes.Companion/MarketNotes.Companion.csproj -c Release -r win-x64 --self-contained true -p:DevBuild=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }}
      - name: Stage the release asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter MarketNotes.Companion.exe companion/MarketNotes.Companion/bin/Release |
            Where-Object { $_.FullName -match '\\publish\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable was not produced." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/MarketNotes.Companion.exe
      - name: Attach the executable to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/MarketNotes.Companion.exe
          fail_on_unmatched_files: true
